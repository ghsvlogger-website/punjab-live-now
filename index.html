<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjab Live Now (PLN) - ਪੰਜਾਬ ਦਾ ਨੰਬਰ 1 ਡਿਜੀਟਲ ਨਿਊਜ਼ ਪੋਰਟਲ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@600;700;800&family=Noto+Sans+Gurmukhi:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-red: #c1121f;
            --brand-red-dark: #780000;
            --navy-dark: #003049;
            --navy-deep: #031926;
            --gold-accent: #fdf0d5;
            --bg-canvas: #f8fafc;
            --card-surface: #ffffff;
            --text-heading: #031926;
            --text-body: #1e293b;
            --text-meta: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(15,23,42,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-canvas); 
            color: var(--text-heading); 
            font-family: 'Noto Sans Gurmukhi', 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.65;
        }

        a, button {
            cursor: pointer !important;
            position: relative;
            z-index: 5;
            transition: all 0.2s ease;
        }

        /* 1. Live Running Clock Top Strip */
        .top-bar {
            background: var(--navy-deep);
            color: #cbd5e1;
            font-size: 0.82rem;
            padding: 7px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-family: 'Noto Sans Gurmukhi', sans-serif;
        }
        .top-bar-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .meta-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--brand-red);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            animation: pulse-live 1.1s infinite;
        }
        @keyframes pulse-live { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .loc-tag { 
            color: #fdf0d5; 
            font-weight: 700;
            background: rgba(253, 240, 213, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .time-tag { 
            color: #ffffff; 
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', 'Noto Sans Gurmukhi', monospace;
            letter-spacing: 0.3px;
        }

        .top-social-bar a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 14px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .top-social-bar a:hover { color: #ffffff; }

        /* 2. Main Broadcast Header */
        header {
            background: #ffffff;
            border-bottom: 2px solid var(--border-light);
            padding: 16px 0;
        }
        .header-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .brand-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: inherit;
        }
        .brand-logo {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid var(--brand-red);
            object-fit: cover;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .brand-text h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.3rem;
            font-weight: 800;
            line-height: 1;
            color: var(--brand-red);
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .brand-text h1 span { color: var(--navy-dark); }
        .brand-text p {
            font-family: 'Noto Sans Gurmukhi', sans-serif;
            font-size: 0.9rem;
            color: var(--text-meta);
            font-weight: 600;
            margin-top: 3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hd-btn {
            font-family: 'Noto Sans Gurmukhi', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-rep { background: #f8fafc; color: var(--navy-dark); border: 1px solid var(--border-light); }
        .btn-rep:hover { background: #e2e8f0; }
        .btn-ad-give { background: #fff1f2; color: var(--brand-red); border: 1px solid #fecdd3; }
        .btn-ad-give:hover { background: var(--brand-red); color: #fff; }
