<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ਇਸ਼ਤਿਹਾਰ ਦਿਓ - Punjab Live Now (PLN)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@600;700;800&family=Noto+Sans+Gurmukhi:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-red: #c1121f;
            --brand-red-dark: #780000;
            --navy-dark: #003049;
            --navy-deep: #031926;
            --bg-canvas: #f8fafc;
            --border-light: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-canvas); color: var(--navy-deep); font-family: 'Noto Sans Gurmukhi', 'Plus Jakarta Sans', -apple-system, sans-serif; line-height: 1.65; }

        header { background: #ffffff; border-bottom: 2px solid var(--border-light); padding: 16px 0; }
        .header-inner { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
        .brand-link { display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; }
        .brand-logo { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--brand-red); }
        .brand-text h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2rem; font-weight: 800; color: var(--brand-red); }
        .brand-text h1 span { color: var(--navy-dark); }

        nav { background: var(--navy-dark); position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--brand-red); }
        .nav-inner { max-width: 1240px; margin: 0 auto; display: flex; }
        .nav-inner a { font-family: 'Noto Sans Gurmukhi', sans-serif; color: #f8fafc; text-decoration: none; padding: 13px 22px; font-size: 1.02rem; font-weight: 700; border-right: 1px solid rgba(255,255,255,0.06); }
        .nav-inner a:hover, .nav-inner a.active { background: var(--brand-red); color: #fff; }

        .container { max-width: 800px; margin: 35px auto; padding: 0 16px; }
        .form-card { background: #fff; border-radius: 10px; border: 1px solid var(--border-light); padding: 30px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .form-card h2 { font-family: 'Baloo Paaji 2', sans-serif; font-size: 1.8rem; color: var(--navy-deep); margin-bottom: 10px; }
        .form-card p { font-size: 0.95rem; color: #64748b; margin-bottom: 24px; }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-weight: 700; font-size: 0.92rem; margin-bottom: 6px; }
        .input-group input, .input-group textarea, .input-group select {
            width: 100%; padding: 12px; border: 1px solid var(--border-light); border-radius: 6px; font-family: inherit; font-size: 0.95rem;
        }
        .submit-btn {
            background: #25D366; color: #fff; border: 0; padding: 14px 24px; border-radius: 6px; font-family: 'Noto Sans Gurmukhi', sans-serif; font-weight: 800; font-size: 1.05rem; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .submit-btn:hover { background: #1ebc57; }

        footer { background: #031926; color: #94a3b8; text-align: center; padding: 35px 16px; margin-top: 60px; border-top: 4px solid var(--brand-red); }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="brand-link">
            <img src="channel_logo1.png" alt="PLN Logo" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>PUNJAB <span>LIVE NOW</span></h1>
            </div>
        </a>
    </div>
</header>

<nav>
    <div class="nav-inner">
        <a href="index.html">ਮੁੱਖ ਪੰਨਾ</a>
        <a href="punjab.html">ਪੰਜਾਬ</a>
        <a href="guruharsahai.html">ਗੁਰੂਹਰਸਹਾਏ</a>
        <a href="videos.html">ਵੀਡੀਓਜ਼</a>
        <a href="advertise.html" class="active">ਇਸ਼ਤਿਹਾਰ ਦਿਓ</a>
    </div>
</nav>

<div class="container">
    <div class="form-card">
        <h2>📢 ਆਪਣਾ ਇਸ਼ਤਿਹਾਰ / ਖ਼ਬਰ ਦਰਜ ਕਰੋ</h2>
        <p>ਆਪਣੇ ਕਾਰੋਬਾਰ ਨੂੰ ਪੰਜਾਬ ਦੇ ਲੱਖਾਂ ਲੋਕਾਂ ਤੱਕ ਪਹੁੰਚਾਉਣ ਲਈ ਵੇਰਵੇ ਭਰੋ, ਸਾਡੀ ਟੀਮ ਤੁਹਾਡੇ ਨਾਲ ਤੁਰੰਤ ਰਾਬਤਾ ਕਾਇਮ ਕਰੇਗੀ।</p>
        
        <form onsubmit="sendToWhatsApp(event)">
            <div class="input-group">
                <label>ਤੁਹਾਡਾ ਨਾਮ / ਕਾਰੋਬਾਰ ਦਾ ਨਾਮ</label>
                <input type="text" id="advName" required placeholder="ਉਦਾਹਰਨ: ਰੌਇਲ ਕਲੌਥ ਹਾਊਸ">
            </div>

            <div class="input-group">
                <label>ਮੋਬਾਈਲ ਨੰਬਰ (WhatsApp)</label>
                <input type="tel" id="advPhone" required placeholder="ਉਦਾਹਰਨ: 9876543210">
            </div>

            <div class="input-group">
                <label>ਇਸ਼ਤਿਹਾਰ ਦੀ ਕਿਸਮ (Type of Ad)</label>
                <select id="advType">
                    <option value="ਮੁੱਖ ਪੰਨਾ ਟੌਪ ਬੈਨਰ (Top Banner)">ਮੁੱਖ ਪੰਨਾ ਟੌਪ ਬੈਨਰ (Top Banner)</option>
                    <option value="ਸਾਈਡਬਾਰ ਬੈਨਰ (Sidebar Ad)">ਸਾਈਡਬਾਰ ਬੈਨਰ (Sidebar Ad)</option>
                    <option value="ਖ਼ਬਰਾਂ ਦੇ ਵਿਚਕਾਰਲਾ ਬੈਨਰ (In-Article Ad)">ਖ਼ਬਰਾਂ ਦੇ ਵਿਚਕਾਰਲਾ ਬੈਨਰ (In-Article Ad)</option>
                    <option value="ਸੋਸ਼ਲ ਮੀਡੀਆ / ਵੀਡੀਓ ਪ੍ਰਮੋਸ਼ਨ">ਸੋਸ਼ਲ ਮੀਡੀਆ / ਵੀਡੀਓ ਪ੍ਰਮੋਸ਼ਨ</option>
                </select>
            </div>

            <div class="input-group">
                <label>ਸੰਦੇਸ਼ / ਇਸ਼ਤਿਹਾਰ ਦਾ ਵੇਰਵਾ</label>
                <textarea id="advMessage" rows="4" placeholder="ਇਸ਼ਤਿਹਾਰ ਸੰਬੰਧੀ ਜ਼ਰੂਰੀ ਜਾਣਕਾਰੀ ਲਿਖੋ..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                💬 WhatsApp 'ਤੇ ਜਾਣਕਾਰੀ ਭੇਜੋ
            </button>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 Punjab Live Now (PLN) Media Network. All Rights Reserved.</p>
</footer>

<script>
function sendToWhatsApp(e) {
    e.preventDefault();
    const name = document.getElementById('advName').value;
    const phone = document.getElementById('advPhone').value;
    const type = document.getElementById('advType').value;
    const msg = document.getElementById('advMessage').value;

    const text = `*ਨਵਾਂ ਇਸ਼ਤਿਹਾਰ ਪੁੱਛਗਿੱਛ (PLN)*%0A%0A*ਨਾਮ/ਫਰਮ:* ${name}%0A*ਫ਼ੋਨ:* ${phone}%0A*ਕਿਸਮ:* ${type}%0A*ਵੇਰਵਾ:* ${msg}`;
    window.open(`https://api.whatsapp.com/send?phone=919876543210&text=${text}`, '_blank');
}
</script>

</body>
</html>
